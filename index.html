<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELA · Humanoid Robot Explorer</title>
    <meta name="description" content="Interactive humanoid robot explainer running real physics in the browser with MuJoCo and Three.js." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%233ddcff' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23ff8a3d'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <header class="brand">
      <div class="logo">VELA</div>
      <div class="tag">Versatile Embodied Learning Agent<br /><span>Humanoid anatomy explorer · live MuJoCo physics</span></div>
    </header>

    <nav id="index" class="index" aria-label="Robot parts"></nav>

    <aside id="panel" class="panel" aria-live="polite"></aside>

    <div class="hud" id="hud"></div>

    <div class="toolbar" role="toolbar">
      <div class="tb-group">
        <button id="play" title="Pause / resume physics (Space)">❚❚</button>
        <button id="reset" title="Reset to standing pose (R)">↺</button>
        <button id="nudge" title="Small sideways push: the robot recovers (N)">Nudge</button>
        <button id="shove" title="Big sideways push: the robot falls (S)">Shove</button>
      </div>
      <label class="tb-group slider" title="Exploded view (E)">
        <span id="explode-label">Explode</span>
        <input id="explode" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
      <div class="tb-group">
        <button id="teardown" class="layer teardown" title="Open the torso and see the components inside (T)">Open torso</button>
      </div>
      <div class="tb-group layers">
        <button data-layer="actuation" class="layer actuation">Actuators</button>
        <button data-layer="sensing" class="layer sensing">Sensors</button>
        <button data-layer="compute" class="layer compute">Compute</button>
        <button id="xray" class="layer xray" title="See-through shell (X)">X-ray</button>
      </div>
    </div>

    <div class="hint" id="hint">Click any part of the robot · drag to orbit · scroll to zoom</div>

    <div id="loading" class="loading">
      <div class="loading-inner">
        <div class="logo big">VELA</div>
        <div class="bar"><i id="load-bar"></i></div>
        <div id="load-text">Starting…</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
